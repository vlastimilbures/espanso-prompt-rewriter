[project]
name = "espanso-prompt-rewriter"
version = "0.9.0"
description = "Cross-platform Espanso prompt workflow with OpenRouter, Anthropic, Ollama, and LM Studio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pyperclip>=1.9,<2",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/vlastimilbures/espanso-prompt-rewriter"
Changelog = "https://github.com/vlastimilbures/espanso-prompt-rewriter/blob/main/CHANGELOG.md"

[project.scripts]
prompt-workflow = "prompt_workflow.cli:app"

# Development tools: `uv sync` installs this group; `uv tool install` never does.
[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16.9,<0.17",
  "mypy>=2.3,<3",
  "pre-commit>=4.6,<5",
  "PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_workflow"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "PT", "C4", "PIE", "RET", "PERF", "FURB"]

[tool.ruff.lint.per-file-ignores]
# _env() returns a dataclasses.field(default_factory=...), not a shared default value.
"src/prompt_workflow/config.py" = ["RUF009"]
# Tests assert, and run the CLI in a subprocess the way Espanso does.
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live'"
markers = ["live: calls the real OpenRouter API (opt-in: pytest -m live)"]

[tool.coverage.run]
branch = true
source = ["prompt_workflow"]

[tool.coverage.report]
fail_under = 95
show_missing = true
