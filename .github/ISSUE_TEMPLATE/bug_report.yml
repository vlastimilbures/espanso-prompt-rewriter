name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste API keys, customer data or confidential drafts. Replace them with fake
        values. Security problems belong in a private report (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: "Include the exact `[promptmend: …]` message if you got one."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Trigger or CLI command, provider, profile, and a fake draft that shows the problem.
      placeholder: |
        1. echo "…" | promptmend improve --provider openrouter --source stdin
        2. …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [openrouter, anthropic, ollama, lmstudio, not provider related]
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Install channel
      options:
        - uv (PyPI or a GitHub Release wheel)
        - Homebrew tap
        - Windows one-command install (install.ps1)
        - Checkout (editable install)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Output of `promptmend --version` and `espanso --version`, plus the model if relevant."
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: promptmend doctor --json
      description: >-
        Output of `promptmend doctor --json`. It never shows a key, your persona or clipboard
        text, but check it and redact anything you would not post publicly.
      render: json
