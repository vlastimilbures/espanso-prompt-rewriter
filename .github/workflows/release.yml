name: release
# Builds the sdist, the wheel and constraints.txt (the runtime pins from uv.lock), installs the
# wheel with those pins into a clean venv on every OS, then attests the files and creates the
# annotated tag v<version> and a GitHub Release with that version's CHANGELOG notes.
#
# A release happens only for a commit on main whose pyproject version has no tag yet:
# - manual dispatch with dry-run unticked (dry-run is the default: it builds and tests, nothing more);
# - a push to main, only while the repository variable RELEASE_ON_PUSH is "true", so merging
#   a branch never releases by surprise.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and test the artifacts only: no attestation, tag or Release"
        type: boolean
        default: true
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release half way, between creating the tag and the Release.
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry-run }}
          RELEASE_ON_PUSH: ${{ vars.RELEASE_ON_PUSH }}
        run: |
          # Fails unless the newest CHANGELOG section is the pyproject version, dated.
          version=$(python3 scripts/release_notes.py version)
          tag="v$version"
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq "map(select(.ref == \"refs/tags/$tag\")) | length")
          build=false
          release=false
          if [ "$EVENT" = workflow_dispatch ]; then build=true; fi
          if [ "$tagged" != 0 ]; then
            echo "::notice::$tag is already tagged; nothing to release."
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::notice::$tag is released only from main, not $GITHUB_REF."
          elif [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN" != true ]; then
            release=true
          elif [ "$EVENT" = push ] && [ "$RELEASE_ON_PUSH" = true ]; then
            build=true
            release=true
          else
            echo "::notice::$tag has no tag yet. Run the release workflow to release it."
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No cache in a workflow that publishes: a poisoned cache could reach the artifacts.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Build sdist, wheel and constraints
        run: |
          uv build --out-dir dist
          uv export --frozen --no-dev --no-emit-project --no-hashes --output-file dist/constraints.txt
      - name: Upload the artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The wheel goes into a clean venv outside the checkout, pinned by the constraints.txt being
  # released, so the check covers what a user installs (see the wheel job in test.yml).
  test-artifacts:
    needs: [plan, build]
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Download the artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - name: Install the wheel with the constraints into a clean venv and check it
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $dist = Join-Path $env:RUNNER_TEMP "dist"
          $wheel = (Get-ChildItem "$dist/*.whl" | Select-Object -First 1).FullName
          $constraints = Join-Path $dist "constraints.txt"
          $venv = Join-Path $env:RUNNER_TEMP "wheel-venv"
          uv venv --python $env:PYTHON_VERSION $venv
          uv pip install --python $venv $wheel -c $constraints
          $python = if ($IsWindows) { "$venv/Scripts/python.exe" } else { "$venv/bin/python" }
          # TODO(#92): use `prompt-workflow --version` once that flag exists.
          $installed = & $python -c "import prompt_workflow; print(prompt_workflow.__version__)"
          if ($installed -ne $env:VERSION) { throw "installed $installed, expected $env:VERSION" }
          & $python "$env:GITHUB_WORKSPACE/scripts/check_wheel.py" --repo $env:GITHUB_WORKSPACE --wheel $wheel --constraints $constraints

  release:
    needs: [plan, build, test-artifacts]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write: the tag, the Release and the attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download the artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/*
      # The tag is made through the API, so no git credentials are stored in the checkout.
      # The Release starts as a draft and is published once every file is attached: with
      # immutable releases enabled in the repository, publishing is what locks it.
      - name: Create the annotated tag and the Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          python3 scripts/release_notes.py notes > "$RUNNER_TEMP/notes.md"
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" \
            -f message="Release $VERSION" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$tag_sha" > /dev/null
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" dist/*
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
