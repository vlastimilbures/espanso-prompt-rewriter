# The quoted CLI placeholder in each cmd below is replaced with the absolute CLI path by
# the install scripts, because GUI-launched Espanso does not inherit shell PATH. It is
# quoted so a path with spaces works; keep every other argument unquoted, since cmd.exe
# mangles a command line that starts with a quote and holds more than one quoted part.
# The CLI finds .env on its own (the repo checkout, or PROMPT_WORKFLOW_ENV), so no `cd`.
matches:
  # Rewrites the clipboard draft into the golden template (see prompts-template.yml).
  # This is the live cloud trigger: it runs on OpenRouter, so the clipboard
  # leaves the machine. The CLI's redaction gate blocks sensitive content
  # unless ALLOW_CLOUD_OVERRIDE=true, but that gate is a heuristic, not a
  # guarantee — only use this trigger where company policy permits.
  - trigger: "-i-"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "\"__PROMPT_WORKFLOW__\" improve --provider openrouter --profile default --source clipboard"

  # Same rewrite on the pro tier: a reasoning model (OPENROUTER_PRO_MODEL) for hard,
  # multi-part drafts. Slower (~5-8 s) but more rigorous. Same cloud caveats as above.
  - trigger: "-ip-"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "\"__PROMPT_WORKFLOW__\" improve --provider openrouter --profile default --tier pro --source clipboard"

  # Same rewrite, but a popup picks the model and its settings for this one call.
  # Built on the pro tier, so "default" in each list means the OPENROUTER_PRO_* setting.
  # Each model carries its OpenRouter endpoint pin as model@endpoint (@auto = OpenRouter's
  # own routing), since one pin only serves one vendor's models. Every field is a fixed
  # choice, never free text, which is what makes {{form1.*}} safe to put unquoted in cmd.
  # Many reasoning models count thinking tokens against the max tokens cap, so pair high
  # effort with 8000+ or the rewrite can come back cut short. Same cloud caveats as above.
  - trigger: "-if-"
    replace: "{{output}}"
    vars:
      - name: form1
        type: form
        params:
          layout: |
            Model:        [[model]]
            Effort:       [[effort]]
            Max tokens:   [[maxtokens]]
            Timeout (s):  [[timeout]]
          fields:
            model:
              type: choice
              values:
                - openai/gpt-6-luna@openai
                - openai/gpt-6-luna@auto
                - google/gemini-3.8-flash@google-ai-studio
                - google/gemini-3.5-flash-lite@google-ai-studio/flex
              default: openai/gpt-6-luna@openai
            effort:
              type: choice
              values: ["default", "none", "minimal", "low", "medium", "high"]
              default: "default"
            maxtokens:
              type: choice
              values: ["default", "2400", "4000", "8000", "16000"]
              default: "default"
            timeout:
              type: choice
              values: ["default", "30", "60", "120", "180"]
              default: "default"
      - name: output
        type: shell
        params:
          cmd: "\"__PROMPT_WORKFLOW__\" improve --provider openrouter --profile default --tier pro --source clipboard --model {{form1.model}} --effort {{form1.effort}} --max-tokens {{form1.maxtokens}} --timeout {{form1.timeout}}"

  - trigger: "-il-"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "\"__PROMPT_WORKFLOW__\" improve --provider ollama --profile general --source clipboard"

  - trigger: "-ilm-"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "\"__PROMPT_WORKFLOW__\" improve --provider lmstudio --profile general --source clipboard"

  # Claude cloud trigger, disabled by default. It sends clipboard content
  # to the Anthropic API. Uncomment only if company policy permits, and note
  # that the CLI still blocks sensitive content unless ALLOW_CLOUD_OVERRIDE=true.
  # - trigger: "-ic-"
  #   replace: "{{output}}"
  #   vars:
  #     - name: output
  #       type: shell
  #       params:
  #         cmd: "\"__PROMPT_WORKFLOW__\" improve --provider anthropic --profile general --source clipboard"
